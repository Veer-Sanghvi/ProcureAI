<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0B0C;
  --surface: #141415;
  --surface-2: #1B1B1D;
  --border: #2A2A2D;
  --text: #FFFFFF;
  --muted: #A3A3A6;
  --accent: #C6F432;
  --accent-hover: #B5E321;
  --on-accent: #0B0B0C;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --measure: 860px;
  --gutter: 16px;
  --radius: 6px;
}
@media (min-width: 640px) { :root { --gutter: 24px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: anywhere;
}
.wrap { max-width: var(--measure); margin: 0 auto; padding: 0 var(--gutter); }

/* Header */
.site-header { border-bottom: 1px solid var(--border); background: var(--bg); }
.site-header .wrap {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 60px; padding-top: 12px; padding-bottom: 12px;
}
.brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--text); text-decoration: none; }
.nav { display: flex; align-items: center; gap: 20px; }
.nav-link { color: var(--muted); font-size: 14px; text-decoration: none; white-space: nowrap; }
.nav-link:hover { color: var(--text); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 600; font-size: 14px; line-height: 1;
  padding: 10px 14px; border-radius: var(--radius);
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--accent-hover); color: var(--on-accent); }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
@media (max-width: 479px) { .nav-link { display: none; } }

/* Content */
/* main.wrap: `.wrap` alone would zero the vertical padding (class beats element) */
main.wrap { padding-top: 48px; padding-bottom: 96px; }
@media (max-width: 600px) { main.wrap { padding-top: 32px; padding-bottom: 72px; } }

h1, h2, h3, h4, h5, h6 { font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; color: var(--text); margin: 0; }
h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 20px; }
h2 {
  font-size: clamp(22px, 4vw, 26px); margin-top: 56px; margin-bottom: 16px;
  padding-top: 18px; position: relative;
}
h2::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 28px; height: 3px; background: var(--accent); border-radius: 2px;
}
h3 { font-size: 19px; margin-top: 36px; margin-bottom: 10px; }
h4, h5, h6 { font-size: 17px; margin-top: 28px; margin-bottom: 8px; }
h1 + h2, h1 + h3 { margin-top: 32px; }
p { margin: 0 0 18px; }
h1 + p { font-size: 19px; line-height: 1.55; color: var(--muted); }
strong { font-weight: 600; }

a { color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--muted); }
a:hover { text-decoration-color: var(--text); }

ul, ol { margin: 0 0 18px; padding-left: 24px; }
li { margin: 6px 0; }
li > ul, li > ol { margin: 6px 0 0; }
li::marker { color: var(--muted); }

blockquote { margin: 0 0 18px; padding: 4px 0 4px 18px; border-left: 2px solid var(--border); color: var(--muted); }
blockquote p:last-child { margin-bottom: 0; }
hr { border: 0; border-top: 1px solid var(--border); margin: 48px 0; }
img, video { max-width: 100%; height: auto; border-radius: var(--radius); border: 1px solid var(--border); }

/* Code */
code, kbd, samp, pre { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0.1em 0.4em; }
pre {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; margin: 0 0 22px; line-height: 1.6;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
pre code { background: none; border: 0; padding: 0; font-size: 14px; white-space: pre; }
h1 code, h2 code, h3 code { font-size: 0.85em; }

/* Tables */
table { width: 100%; border-collapse: collapse; margin: 0 0 24px; font-size: 15px; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; }
th { background: var(--surface); font-weight: 600; }
td code { white-space: nowrap; }

/* Footer */
.site-footer { border-top: 1px solid var(--border); }
.site-footer .wrap { padding-top: 20px; padding-bottom: 28px; font-size: 14px; color: var(--muted); }
.site-footer a { color: var(--muted); text-decoration-color: var(--border); }
.site-footer a:hover { color: var(--text); text-decoration-color: var(--text); }

::selection { background: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="nav" aria-label="Site">
      <a class="nav-link" href="https://veer-sanghvi.github.io/">Veer Sanghvi portfolio</a>
      <a class="btn" href="{{ site.github.repository_url }}">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        View on GitHub
      </a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer">
  <div class="wrap">
    <a href="{{ site.github.repository_url }}">{{ site.github.repository_nwo }}</a>
  </div>
</footer>
</body>
</html>
